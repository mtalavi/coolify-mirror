name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/coolify-mirror-linux-* dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/coolify-mirror-linux-* dist/SHA256SUMS --clobber
