<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#141228"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>

  <text x="64" y="104" fill="#a78bfa" font-size="18" letter-spacing="4">◆ OPEN SOURCE · MIT</text>
  <text x="64" y="168" fill="#f4f4f5" font-size="58" font-weight="700">Coolify Mirror</text>
  <text x="64" y="214" fill="#a1a1aa" font-size="21">Back up one app or the whole server.</text>
  <text x="64" y="244" fill="#a1a1aa" font-size="21">Paste one command on the new server:</text>
  <text x="64" y="274" fill="#a1a1aa" font-size="21">same projects, data and domains, running.</text>
  <g font-size="15">
    <rect x="64" y="310" width="170" height="36" rx="8" fill="#1f1b3a" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <text x="149" y="333" fill="#c4b5fd" text-anchor="middle">single binary</text>
    <rect x="246" y="310" width="190" height="36" rx="8" fill="#1f1b3a" stroke="#6366f1" stroke-opacity="0.6"/>
    <text x="341" y="333" fill="#c7d2fe" text-anchor="middle">encrypted (age)</text>
    <rect x="448" y="310" width="160" height="36" rx="8" fill="#10261a" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="528" y="333" fill="#86efac" text-anchor="middle">no rebuild</text>
  </g>

  <!-- source server -->
  <g transform="translate(700 110)">
    <rect width="170" height="200" rx="14" fill="#11131c" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="85" y="34" fill="#c4b5fd" font-size="14" text-anchor="middle">SOURCE</text>
    <rect x="22" y="54" width="126" height="26" rx="6" fill="#1f1b3a"/><circle cx="38" cy="67" r="4" fill="#22c55e"/><text x="50" y="72" fill="#d4d4d8" font-size="13">shop.com</text>
    <rect x="22" y="88" width="126" height="26" rx="6" fill="#1f1b3a"/><circle cx="38" cy="101" r="4" fill="#22c55e"/><text x="50" y="106" fill="#d4d4d8" font-size="13">blog.com</text>
    <rect x="22" y="122" width="126" height="26" rx="6" fill="#1f1b3a"/><circle cx="38" cy="135" r="4" fill="#22c55e"/><text x="50" y="140" fill="#d4d4d8" font-size="13">postgres</text>
    <rect x="22" y="156" width="126" height="26" rx="6" fill="#1f1b3a"/><circle cx="38" cy="169" r="4" fill="#22c55e"/><text x="50" y="174" fill="#d4d4d8" font-size="13">volumes</text>
  </g>
  <!-- beam -->
  <rect x="880" y="204" width="80" height="10" rx="5" fill="url(#beam)" filter="url(#glow)" opacity="0.8"/>
  <rect x="880" y="206" width="80" height="6" rx="3" fill="url(#beam)"/>
  <text x="920" y="192" fill="#a1a1aa" font-size="12" text-anchor="middle">one command</text>
  <!-- target server -->
  <g transform="translate(970 110)">
    <rect width="170" height="200" rx="14" fill="#11131c" stroke="#22c55e" stroke-opacity="0.7"/>
    <text x="85" y="34" fill="#86efac" font-size="14" text-anchor="middle">TARGET</text>
    <rect x="22" y="54" width="126" height="26" rx="6" fill="#10261a"/><circle cx="38" cy="67" r="4" fill="#22c55e"/><text x="50" y="72" fill="#d4d4d8" font-size="13">shop.com</text>
    <rect x="22" y="88" width="126" height="26" rx="6" fill="#10261a"/><circle cx="38" cy="101" r="4" fill="#22c55e"/><text x="50" y="106" fill="#d4d4d8" font-size="13">blog.com</text>
    <rect x="22" y="122" width="126" height="26" rx="6" fill="#10261a"/><circle cx="38" cy="135" r="4" fill="#22c55e"/><text x="50" y="140" fill="#d4d4d8" font-size="13">postgres</text>
    <rect x="22" y="156" width="126" height="26" rx="6" fill="#10261a"/><circle cx="38" cy="169" r="4" fill="#22c55e"/><text x="50" y="174" fill="#d4d4d8" font-size="13">volumes</text>
  </g>
  <text x="920" y="350" fill="#71717a" font-size="13" text-anchor="middle">for Coolify v4 · Linux amd64 / arm64</text>
</svg>
